<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>BWCAA Company</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background-color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

/* BARRA AZUL */
.topo {
  height: 30%;
  background-color: #00008B;
  display: flex;
  justify-content: center;
  align-items: center;
  transform: translateY(-100%);
  transition: transform 3s ease-out;
}
.topo.ativo { transform: translateY(0); }

/* TÍTULO */
.titulo {
  color: white;
  font-size: 80px;
  font-weight: bold;
  letter-spacing: 3px;
  opacity: 0;
  transform: translateY(-120px);
  transition: transform 3s ease-out, opacity 3s ease-out;
  text-transform: uppercase;
}
.titulo.ativo {
  opacity: 1;
  transform: translateY(0);
}

/* IMAGEM */
.imagem-canto {
  position: fixed;
  top: 10px;
  left: 10px;
  width: 150px;
  transform: translateY(-100%);
  transition: transform 3s ease-out;
  z-index: 1000;
}
.imagem-canto.ativo { transform: translateY(0); }

/* BOTÃO MENU */
.botao-menu {
  position: fixed;
  top: 20px;
  right: 20px;
  background-color: #00008B;
  color: white;
  padding: 10px 15px;
  cursor: pointer;
  border: none;
  font-size: 24px;
  z-index: 1100;
  border-radius: 5px;
  transform: translateY(-100%);
  transition: transform 3s ease-out;
}
.botao-menu.ativo { transform: translateY(0); }

/* MENU LATERAL */
.menu-lateral {
  position: fixed;
  top: 0;
  left: -250px; /* fora da tela inicialmente */
  width: 250px;
  height: 100%;
  background-color: #1E1E1E;
  padding-top: 60px;
  transition: left 0.5s ease;
  z-index: 1050;
}
.menu-lateral.aberto { left: 0; }

.menu-lateral a {
  display: block;
  padding: 15px 25px;
  color: white;
  text-decoration: none;
  font-size: 18px;
  cursor: pointer;
}
.menu-lateral a:hover {
  background-color: #00008B;
}
</style>
</head>

<body>

<div class="topo" id="topo">
  <div class="titulo" id="titulo">BWCAA Company</div>
</div>

<img src="BWCAA-removebg-preview.png" class="imagem-canto" id="imagem">

<button class="botao-menu" id="botao-menu">☰</button>

<div class="menu-lateral" id="menu">
  <a onclick="abrirPagina('BWCAA Company')">Home</a>
  <a onclick="abrirFuncionarios()">Funcionários</a>
  <a onclick="abrirPagina('História')">História</a>
</div>

<script>
const topo = document.getElementById("topo");
const titulo = document.getElementById("titulo");
const imagem = document.getElementById("imagem");
const botaoMenu = document.getElementById("botao-menu");
const menu = document.getElementById("menu");

/* ANIMAÇÕES */
window.onload = () => {
  setTimeout(() => {
    topo.classList.add("ativo");
    imagem.classList.add("ativo");
    botaoMenu.classList.add("ativo");
  }, 100);

  setTimeout(() => {
    titulo.classList.add("ativo");
  }, 300);
};

/* MENU */
botaoMenu.onclick = () => {
  menu.classList.toggle("aberto");
  botaoMenu.textContent = menu.classList.contains("aberto") ? "✖" : "☰";
};

function abrirPagina(nome) {
  titulo.textContent = nome;
  menu.classList.remove("aberto");
  botaoMenu.textContent = "☰";
}

/* SENHA SIMPLES ESCONDIDA */
function abrirFuncionarios() {
  const entrada = prompt("Digite a senha:");
  if (!entrada) return;

  const valor = Number(entrada);
  const resultado = valor * 7 + 13;

  // hash da senha (50901 * 7 + 13)
  const hash = 356320;

  if (resultado === hash) {
    const aba = window.open("", "_blank");
    aba.document.write(`
      <!DOCTYPE html>
      <html lang="pt-BR">
      <head>
        <meta charset="UTF-8">
        <title>Funcionários</title>
        <style>
          body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #00008B;
            color: white;
            font-family: Arial;
            font-size: 60px;
            font-weight: bold;
          }
        </style>
      </head>
      <body>TESTE</body>
      </html>
    `);
    aba.document.close();
  } else {
    alert("Senha incorreta!");
  }

  menu.classList.remove("aberto");
  botaoMenu.textContent = "☰";
}
</script>

</body>
</html>
