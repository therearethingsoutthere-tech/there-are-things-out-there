<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>BWCAA Company</title>

  <style>
    html, body {
      margin: ;
      width: 100%;
      height: 100%;
      background-color: # 000080;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .titulo {
      margin-top: 20vh;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 60px;
      font-weight: bold;
      letter-spacing: 3px;

      opacity: 0;
      transform: translateY(-120px);
      transition: transform 3s ease-out, opacity 3s ease-out;
    }

    .titulo.ativo {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <div class="titulo" id="titulo">BWCAA Company</div>

  <script>
    window.onload = () => {
      const titulo = document.getElementById("titulo");
      setTimeout(() => {
        titulo.classList.add("ativo");
      }, 100);
    };
  </script>
</body>
</html>
