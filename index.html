<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>BWCAA Company</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      overflow: hidden;
    }

    /* Barra azul de cima */
    .topo {
      height: 30%;
      background-color: #00008B;
      display: flex;
      justify-content: center;
      align-items: center;

      transform: translateY(-100%); /* fora da tela inicialmente */
      transition: transform 3s ease-out; /* mesma velocidade da animação */
    }

    .topo.ativo {
      transform: translateY(0); /* posição final */
    }

    /* Texto animado */
    .titulo {
      color: white;
      font-family: brunson;
      font-size: 80px;
      font-weight: bold;
      letter-spacing: 3px;

      opacity: 0;
      transform: translateY(-120px);
      transition: transform 3s ease-out, opacity 3s ease-out;
    }

    .titulo.ativo {
      opacity: 1;
      transform: translateY(0);
    }

    /* Imagem animada descendo junto com a barra */
    .imagem-canto {
      position: fixed;
      top: 10px;           /* posição inicial antes de animar */
      left: 10px;
      width: 350px;
      height: auto;

      transform: translateY(-100%); /* fora da tela inicialmente */
      transition: transform 3s ease-out; /* mesma velocidade que a barra */
      z-index: 1000;
    }

    .imagem-canto.ativo {
      transform: translateY(0); /* desce para a posição final */
    }
  </style>
</head>

<body>
  <div class="topo" id="topo">
    <div class="titulo" id="titulo">BWCAA Company</div>
  </div>

  <img src="BWCAA-removebg-preview.png" alt="BWCAA Company" class="imagem-canto" id="imagem">

  <script>
    window.onload = () => {
      const topo = document.getElementById("topo");
      const titulo = document.getElementById("titulo");
      const imagem = document.getElementById("imagem");

      // Animação da barra azul
      setTimeout(() => {
        topo.classList.add("ativo");
        imagem.classList.add("ativo"); // anima a imagem ao mesmo tempo
      }, 100);

      // Animação do texto (começa depois da barra e da imagem)
      setTimeout(() => {
        titulo.classList.add("ativo");
      }, 300);
    };
  </script>
</body>
</html>
