<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>BWCAA Company</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      overflow: hidden;
    }

    /* Barra azul de cima */
    .topo {
      height: 30%;
      background-color: #00008B;

      display: flex;
      justify-content: center;
      align-items: center;

      /* Animação inicial: fora da tela */
      transform: translateY(-100%);
      transition: transform 3s ease-out;
    }

    /* Barra animada para posição final */
    .topo.ativo {
      transform: translateY(0);
    }
.imagem-canto {
  position: fixed; /* fixa a imagem na tela */
  top: 10px;       /* distância do topo */
  left: 10px;      /* distância da esquerda */
  width: 100px;    /* ajuste o tamanho que quiser */
  height: auto;    /* mantém proporção */
  z-index: 1000;   /* garante que fique acima de outros elementos */
}

    /* Texto animado */
    .titulo {
      color: white;
      font-family: brunson;
      font-size: 80px;
      font-weight: bold;
      letter-spacing: 3px;

      opacity: 0;
      transform: translateY(-120px);
      transition: transform 3s ease-out, opacity 3s ease-out;
    }

    .titulo.ativo {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <div class="topo" id="topo">
    <div class="titulo" id="titulo">BWCAA Company</div>
  </div>
<img src="BWCAA-removebg-preview.png" alt="BWCAA Company" class="imagem-canto">

  <script>
    window.onload = () => {
      const topo = document.getElementById("topo");
      const titulo = document.getElementById("titulo");

      // Animação da barra azul
      setTimeout(() => {
        topo.classList.add("ativo");
      }, 100);

      // Animação do texto (começa depois da barra)
      setTimeout(() => {
        titulo.classList.add("ativo");
      }, 300); // pode ajustar o delay se quiser sincronizar
    };
  </script>
</body>
</html>
