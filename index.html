<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>BWCAA Company</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      scroll-behavior: smooth;
    }

    .topo {
      height: 30%;
      background-color: #00008B;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: translateY(-100%);
      transition: transform 3s ease-out;
    }

    .topo.ativo { transform: translateY(0); }

    .titulo {
      color: white;
      font-size: 80px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(-120px);
      transition: transform 3s ease-out, opacity 3s ease-out;
    }

    .titulo.ativo {
      opacity: 1;
      transform: translateY(0);
    }

    .imagem-canto {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 150px;
      transform: translateY(-100%);
      transition: transform 3s ease-out;
      z-index: 1000;
    }

    .imagem-canto.ativo { transform: translateY(0); }

    .botao-menu {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #00008B;
      color: white;
      padding: 10px 15px;
      font-size: 20px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      z-index: 1100;
      transform: translateY(-100%);
      transition: transform 3s ease-out;
    }

    .botao-menu.ativo { transform: translateY(0); }

    .botao-menu span {
      display: inline-block;
      transition: transform 0.4s ease;
    }

    .botao-menu.aberto span { transform: rotate(90deg); }

    .menu-lateral {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background-color: #1E1E1E;
      padding-top: 60px;
      transform: translateY(-100%);
      transition: left 0.5s ease, transform 3s ease-out;
      z-index: 1050;
    }

    .menu-lateral.ativo { transform: translateY(0); }
    .menu-lateral.aberto { left: 0; }

    .menu-lateral a {
      display: block;
      padding: 15px 25px;
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .menu-lateral a:hover {
      background-color: #00008B;
    }
  </style>
</head>

<body>

  <div class="topo" id="topo">
    <div class="titulo" id="titulo">BWCAA Company</div>
  </div>

  <img src="BWCAA-removebg-preview.png" class="imagem-canto" id="imagem">

  <button class="botao-menu" id="botao-menu">
    <span>☰</span>
  </button>

  <!-- MENU CLICÁVEL -->
  <div class="menu-lateral" id="menu-lateral">
    <a href="#sobre" class="link-menu">O que é a BWCAA</a>
    <a href="#funcionarios" class="link-menu">Área de Funcionários</a>
    <a href="#historia" class="link-menu">História da Empresa</a>
  </div>

  <!-- ⚠️ SUAS SEÇÕES JÁ EXISTENTES -->
  <!-- Exemplo (não precisa criar se já tiver): -->
  <!--
  <section id="sobre"></section>
  <section id="funcionarios"></section>
  <section id="historia"></section>
  -->

  <script>
    window.onload = () => {
      const topo = document.getElementById("topo");
      const titulo = document.getElementById("titulo");
      const imagem = document.getElementById("imagem");
      const botaoMenu = document.getElementById("botao-menu");
      const menuLateral = document.getElementById("menu-lateral");
      const linksMenu = document.querySelectorAll(".link-menu");

      setTimeout(() => {
        topo.classList.add("ativo");
        imagem.classList.add("ativo");
        menuLateral.classList.add("ativo");
        botaoMenu.classList.add("ativo");
      }, 100);

      setTimeout(() => {
        titulo.classList.add("ativo");
      }, 300);

      botaoMenu.onclick = () => {
        menuLateral.classList.toggle("aberto");
        botaoMenu.classList.toggle("aberto");
        botaoMenu.querySelector("span").textContent =
          menuLateral.classList.contains("aberto") ? "✖" : "☰";
      };

      /* FECHA MENU AO CLICAR EM UMA ABA */
      linksMenu.forEach(link => {
        link.addEventListener("click", () => {
          menuLateral.classList.remove("aberto");
          botaoMenu.classList.remove("aberto");
          botaoMenu.querySelector("span").textContent = "☰";
        });
      });
    };
  </script>

</body>
</html>
