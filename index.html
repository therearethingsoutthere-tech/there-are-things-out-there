<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>BWCAA Company</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    /* Barra azul de cima */
    .topo {
      height: 30%;
      background-color: #00008B;
      display: flex;
      justify-content: center;
      align-items: center;

      transform: translateY(-100%);
      transition: transform 3s ease-out;
    }

    .topo.ativo {
      transform: translateY(0);
    }

    /* Texto animado */
    .titulo {
      color: white;
      font-family: brunson;
      font-size: 80px;
      font-weight: bold;
      letter-spacing: 3px;

      opacity: 0;
      transform: translateY(-120px);
      transition: transform 3s ease-out, opacity 3s ease-out;
    }

    .titulo.ativo {
      opacity: 1;
      transform: translateY(0);
    }

    /* Imagem */
    .imagem-canto {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 150px;
      transform: translateY(-100%);
      transition: transform 3s ease-out;
      z-index: 1000;
    }

    .imagem-canto.ativo {
      transform: translateY(0);
    }

    /* Botão menu */
    .botao-menu {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #00008B;
      color: white;
      padding: 10px 15px;
      cursor: pointer;
      border: none;
      font-size: 20px;
      z-index: 1100;
      border-radius: 5px;

      /* NOVO */
      transform: translateY(-100%);
      transition: 
        transform 3s ease-out,
        background 0.3s ease;
    }

    .botao-menu.ativo {
      transform: translateY(0);
    }

    /* Animação do símbolo */
    .botao-menu span {
      display: inline-block;
      transition: transform 0.4s ease;
    }

    .botao-menu.aberto span {
      transform: rotate(90deg);
    }

    /* Menu lateral */
    .menu-lateral {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background-color: #1E1E1E;
      padding-top: 60px;

      transform: translateY(-100%);
      transition:
        left 0.5s ease,
        transform 3s ease-out;

      z-index: 1050;
    }

    .menu-lateral.ativo {
      transform: translateY(0);
    }

    .menu-lateral.aberto {
      left: 0;
    }

    .menu-lateral a {
      display: block;
      padding: 15px 25px;
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .menu-lateral a:hover {
      background-color: #00008B;
    }
  </style>
</head>

<body>
  <div class="topo" id="topo">
    <div class="titulo" id="titulo">BWCAA Company</div>
  </div>

  <img src="BWCAA-removebg-preview.png" class="imagem-canto" id="imagem">

  <!-- Botão menu com span -->
  <button class="botao-menu" id="botao-menu">
    <span>☰</span>
  </button>

  <div class="menu-lateral" id="menu-lateral">
    <a href="#">O que é a BWCAA</a>
    <a href="#">Área de Funcionários</a>
    <a href="#">História da Empresa</a>
  </div>

  <script>
    window.onload = () => {
      const topo = document.getElementById("topo");
      const titulo = document.getElementById("titulo");
      const imagem = document.getElementById("imagem");
      const botaoMenu = document.getElementById("botao-menu");
      const menuLateral = document.getElementById("menu-lateral");

      // Animações iniciais
      setTimeout(() => {
        topo.classList.add("ativo");
        imagem.classList.add("ativo");
        menuLateral.classList.add("ativo");
        botaoMenu.classList.add("ativo");
      }, 100);

      setTimeout(() => {
        titulo.classList.add("ativo");
      }, 300);

      // Menu toggle
      botaoMenu.onclick = () => {
        menuLateral.classList.toggle("aberto");
        botaoMenu.classList.toggle("aberto");

        // troca símbolo
        const span = botaoMenu.querySelector("span");
        span.textContent = menuLateral.classList.contains("aberto") ? "✖" : "☰";
      };
    };
  </script>
</body>
</html>
