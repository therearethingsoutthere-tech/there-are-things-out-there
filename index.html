<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>BWCAA Company</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    /* BARRA AZUL */
    .topo {
      height: 30%;
      background-color: #00008B;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: translateY(-100%);
      transition: transform 3s ease-out;
    }
    .topo.ativo { transform: translateY(0); }

    /* TEXTO */
    .titulo {
      color: white;
      font-size: 80px;
      font-weight: bold;
      letter-spacing: 3px;
      opacity: 0;
      transform: translateY(-120px);
      transition: transform 3s ease-out, opacity 3s ease-out;
      text-transform: uppercase;
    }
    .titulo.ativo {
      opacity: 1;
      transform: translateY(0);
    }

    /* IMAGEM */
    .imagem-canto {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 150px;
      transform: translateY(-100%);
      transition: transform 3s ease-out;
      z-index: 1000;
    }
    .imagem-canto.ativo { transform: translateY(0); }

    /* BOTÃO MENU */
    .botao-menu {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #00008B;
      color: white;
      padding: 10px 15px;
      cursor: pointer;
      border: none;
      font-size: 20px;
      z-index: 1100;
      border-radius: 5px;
      transform: translateY(-100%);
      transition: transform 3s ease-out;
    }
    .botao-menu.ativo { transform: translateY(0); }
